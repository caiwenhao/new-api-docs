services:
  # MkDocs主服务
  mkdocs:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mkdocs
    restart: unless-stopped
    ports:
      - "2004:8000"
    volumes:
      - .:/docs
    working_dir: /docs
    entrypoint: ["/bin/sh", "-c"]
    command: ./dev-server.sh
    environment:
      - TZ=Asia/Shanghai
    networks:
      - docs-network

  # 辅助更新服务
  docs-updater:
    build:
      context: ./docs_assistant
      dockerfile: Dockerfile
    container_name: docs-updater
    restart: unless-stopped
    volumes:
      - .:/app/docs
    environment:
      - UPDATE_INTERVAL=1800  # 30分钟更新一次
      # - GITHUB_REPO=  # 移除开源项目依赖
      - DOCS_DIR=/app/docs
      - USE_PROXY=false
      # - GITHUB_PROXY=  # 移除 GitHub 代理
      # - AFDIAN_USER_ID=  # 移除爱发电依赖
      # - AFDIAN_TOKEN=  # 移除爱发电依赖
      - TZ=Asia/Shanghai
    networks:
      - docs-network
    depends_on:
      - mkdocs

networks:
  docs-network:
    driver: bridge