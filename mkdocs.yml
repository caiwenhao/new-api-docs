site_name: Kapon AI API 文档
site_url: https://models.kapon.cloud
site_author: Kapon AI
site_description: 专业的 AI 模型 API 服务平台 - 提供高质量的大语言模型接口与 AI 应用开发指南

# Repository - 移除开源项目引用
# repo_name:
# repo_url:
# edit_uri:

theme:
  name: material
  language: zh
  custom_dir: newapi/overrides
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate 
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.path
    - navigation.sections
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - navigation.expand
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)" 
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: 切换到系统主题
  font: false
    # text: Roboto
    # code: Roboto Mono
  favicon: assets/kapon-favicon.svg
  logo: assets/kapon-logo.png
  # icon:
  #   repo: fontawesome/brands/github

extra:
  alternate:
    - name: 简体中文
      link: /
      lang: zh
    - name: English
      link: /en/
      lang: en
  social:
    - icon: fontawesome/solid/globe
      link: https://models.kapon.cloud
      name: Kapon AI 官网
    - icon: fontawesome/solid/envelope
      link: mailto:support@kapon.cloud
      name: 联系我们
  # analytics:
  #   provider: google
  #   property: G-VHJ4VGJB6N
  consent:
    title: Cookie 同意
    description: >- 
      我们使用 Cookie 来识别您的重复访问和偏好，以及衡量我们文档的有效性和用户是否找到他们要找的内容。
    cookies:
      analytics: Google Analytics
  generator: false

nav:
  - 首页: index.md
  - 控制台: https://models.kapon.cloud/
  - API 文档:
    - 🏠 API 概览: api/index.md
    - 🔑 认证方式: api/authentication.md
    - 📘 OpenAPI 参考: api/reference.md
    - 💬 对话接口:
      - OpenAI Chat: api/openai-chat.md
      - OpenAI Responses: api/openai-responses.md
      - Anthropic Messages: api/anthropic-chat.md
      - Deepseek Reasoning: api/deepseek-reasoning-chat.md
      - Google Gemini: api/google-gemini-chat.md
    - 🔤 嵌入接口:
      - OpenAI Embeddings: api/openai-embedding.md
    - 🔄 重排序接口:
      - Jina AI Rerank: api/jinaai-rerank.md
      - Cohere Rerank: api/cohere-rerank.md
      - Xinference Rerank: api/xinference-rerank.md
    - ⚡ 实时对话:
      - OpenAI Realtime: api/openai-realtime.md
    - 🖼️ 图像生成:
      - OpenAI Image: api/openai-image.md
      - Midjourney Proxy: api/midjourney-proxy-image.md
    - 🔊 音频处理:
      - OpenAI Audio: api/openai-audio.md
    - 🎵 音乐生成:
      - Suno Music: api/suno-music.md
    - 🎥 视频生成:
      - 生成视频: api/generate-video.md
      - 查询视频: api/query-video.md
  - AI 应用指南:
    - 🏠 应用开发概览: apps/index.md
    - 🚀 快速集成:
      - Python SDK: apps/python-sdk.md
      - JavaScript SDK: apps/javascript-sdk.md
      - cURL 示例: apps/curl-examples.md
    - 💡 最佳实践:
      - 提示词工程: apps/prompt-engineering.md
      - 错误处理: apps/error-handling.md
      - 性能优化: apps/performance-optimization.md
    - 🧩 实战案例:
      - 聊天机器人: apps/chatbot-example.md
      - 内容生成器: apps/content-generation.md
      - 智能翻译: apps/translation-example.md
  - 帮助支持:
    - 🏠 帮助中心: support/index.md
    - ❓ 常见问题: support/faq.md
    - 💰 定价方案: support/pricing.md

plugins:
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - tags
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: zh
          name: 简体中文
          build: true
          default: true
          site_name: "Kapon AI"
        - locale: en
          name: English
          build: true
          site_name: "Kapon AI API Documentation"
          nav_translations:
            首页: Home
            控制台: Console
            "API 文档": "API Documentation"
