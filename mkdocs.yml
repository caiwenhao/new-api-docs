            "OpenAI Embeddings": "OpenAI Embeddings"
            "🔄 重排序接口": "Rerank APIs"
            "Jina AI Rerank": "Jina AI Rerank"
            "Cohere Rerank": "Cohere Rerank"
            "Xinference Rerank": "Xinference Rerank"
