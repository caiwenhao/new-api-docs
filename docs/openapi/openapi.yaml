openapi: 3.0.3
info:
  title: Kapon AI API
  version: 1.0.0
  description: |
    OpenAPI 规范用于描述 Kapon AI 兼容的主要接口（OpenAI 风格）。
    - 基本 URL: https://models.kapon.cloud/v1
    - 认证方式: `Authorization: Bearer <API_KEY>`
  contact:
    name: Kapon Support
    url: https://models.kapon.cloud/support
servers:
  - url: https://models.kapon.cloud/v1
security:
  - BearerAuth: []
paths:
  /chat/completions:
    post:
      summary: Chat Completions（OpenAI 兼容）
      description: 生成聊天模型回复，兼容 OpenAI 的 Chat Completions 接口。
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionsRequest'
            examples:
              basic:
                value:
                  model: gpt-4
                  messages:
                    - role: user
                      content: "Hello!"
                  temperature: 0.7
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '429':
          $ref: '#/components/responses/RateLimitError'

  /embeddings:
    post:
      summary: Embeddings（OpenAI 兼容）
      tags: [Embeddings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingsRequest'
            examples:
              basic:
                value:
                  model: text-embedding-3-small
                  input: "Hello world"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingsResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /images/generations:
    post:
      summary: Image generation（OpenAI 兼容）
      tags: [Image]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
            examples:
              basic:
                value:
                  model: dall-e-3
                  prompt: "A cute robot reading a book"
                  size: "1024x1024"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImageGenerationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    UnauthorizedError:
      description: Unauthorized — invalid or missing API key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimitError:
      description: Too Many Requests.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [system, user, assistant, tool]
        content:
          type: string
      required: [role, content]

    ChatCompletionsRequest:
      type: object
      properties:
        model:
          type: string
          example: gpt-4
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        temperature:
          type: number
          minimum: 0
          maximum: 2
          default: 1
        max_tokens:
          type: integer
      required: [model, messages]

    ChatChoice:
      type: object
      properties:
        index:
          type: integer
        message:
          $ref: '#/components/schemas/ChatMessage'
        finish_reason:
          type: string

    ChatCompletionsResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
          example: chat.completion
        created:
          type: integer
        model:
          type: string
        choices:
          type: array
          items:
            $ref: '#/components/schemas/ChatChoice'

    EmbeddingsRequest:
      type: object
      properties:
        model:
          type: string
          example: text-embedding-3-small
        input:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
      required: [model, input]

    EmbeddingVector:
      type: object
      properties:
        object:
          type: string
        embedding:
          type: array
          items:
            type: number
        index:
          type: integer

    EmbeddingsResponse:
      type: object
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/EmbeddingVector'
        model:
          type: string

    ImageGenerationRequest:
      type: object
      properties:
        model:
          type: string
          example: dall-e-3
        prompt:
          type: string
        size:
          type: string
          enum: ["1024x1024", "1024x1792", "1792x1024"]
      required: [model, prompt]

    ImageData:
      type: object
      properties:
        b64_json:
          type: string

    ImageGenerationResponse:
      type: object
      properties:
        created:
          type: integer
        data:
          type: array
          items:
            $ref: '#/components/schemas/ImageData'

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            message:
              type: string
            type:
              type: string
            code:
              type: string
